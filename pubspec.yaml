name: imu_collector
description: Table tennis IMU session recorder for Wear OS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^5.0.1
  path_provider: ^2.1.3
  wakelock_plus: ^1.2.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
